# Core engine settings (owner: F2). Read as cfg["core"] by engine/config.py.

[study]
# The 13 study months, inclusive, as YYYY-MM.
start = "2025-09"
end = "2026-09"
# Whole forecast years shown after the study months (slider "2030").
forecast_years = [2030]
# Time zone for all date-times: East Africa Time, UTC+3, no daylight saving.
timezone = "Africa/Kampala"

[run]
# Stages run by `python -m engine.cli run` when --stages is not given, in this order.
stages = ["network", "losses", "validation", "reconciliation", "remedies",
          "contingency", "forecast", "kawanda", "sites", "incidents"]

[map]
# Line colours on the map (contracts section 10).
colours = { green = "#2e7d32", amber = "#f9a825", red = "#c62828", grey = "#9e9e9e" }
# Loading: green below amber_from, amber up to red_from, red above.
loading_pct = { amber_from = 80, red_from = 100 }
# Loss density (kW per km): coloured by quantile of the month's values.
loss_density_quantiles = { amber_from = 0.5, red_from = 0.8 }
# Asset age in years: green below amber_from, amber up to red_from, red above.
age_years = { amber_from = 15, red_from = 30 }
