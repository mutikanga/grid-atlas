required_sheet = false
notes = "vk_hv_percent is HV-MV, vk_mv_percent is MV-LV and vk_lv_percent is LV-HV, each on the smaller of the two windings' ratings."
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "trafo_id", type = "text", required = true, desc = "Your transformer identifier", example = "EXA-T3" },
  { name = "name", type = "text", desc = "Transformer name", example = "Example A transformer 3" },
  { name = "substation", type = "text", required = true, desc = "Substation name as you use it", example = "Example A" },
  { name = "hv_bus", type = "text", required = true, desc = "HV bus_id", example = "2201" },
  { name = "mv_bus", type = "text", required = true, desc = "MV bus_id", example = "1301" },
  { name = "lv_bus", type = "text", required = true, desc = "LV bus_id", example = "3301" },
  { name = "sn_hv_mva", type = "number", unit = "MVA", required = true, min = 0, desc = "HV winding rating", example = 150 },
  { name = "sn_mv_mva", type = "number", unit = "MVA", required = true, min = 0, desc = "MV winding rating", example = 150 },
  { name = "sn_lv_mva", type = "number", unit = "MVA", required = true, min = 0, desc = "LV winding rating", example = 50 },
  { name = "vn_hv_kv", type = "number", unit = "kV", required = true, desc = "Rated HV voltage", example = 220 },
  { name = "vn_mv_kv", type = "number", unit = "kV", required = true, desc = "Rated MV voltage", example = 132 },
  { name = "vn_lv_kv", type = "number", unit = "kV", required = true, desc = "Rated LV voltage", example = 33 },
  { name = "vk_hv_percent", type = "number", unit = "%", required = true, min = 0, desc = "Short-circuit voltage HV-MV", example = 12.0 },
  { name = "vk_mv_percent", type = "number", unit = "%", required = true, min = 0, desc = "Short-circuit voltage MV-LV", example = 8.0 },
  { name = "vk_lv_percent", type = "number", unit = "%", required = true, min = 0, desc = "Short-circuit voltage LV-HV", example = 18.0 },
  { name = "vkr_hv_percent", type = "number", unit = "%", min = 0, desc = "Resistive part HV-MV", example = 0.3 },
  { name = "vkr_mv_percent", type = "number", unit = "%", min = 0, desc = "Resistive part MV-LV", example = 0.3 },
  { name = "vkr_lv_percent", type = "number", unit = "%", min = 0, desc = "Resistive part LV-HV", example = 0.3 },
  { name = "pfe_kw", type = "number", unit = "kW", min = 0, desc = "No-load (iron) losses", example = 90 },
  { name = "i0_percent", type = "number", unit = "%", min = 0, desc = "No-load current", example = 0.05 },
  { name = "tap_side", type = "enum", enum = ["hv", "mv", "lv"], desc = "Winding with the tap changer", example = "hv" },
  { name = "tap_neutral", type = "int", desc = "Neutral tap position", example = 0 },
  { name = "tap_min", type = "int", desc = "Lowest tap position", example = -10 },
  { name = "tap_max", type = "int", desc = "Highest tap position", example = 10 },
  { name = "tap_step_percent", type = "number", unit = "%", min = 0, desc = "Voltage change per tap step", example = 1.25 },
  { name = "tap_pos", type = "int", desc = "Tap position in this case", example = 0 },
  { name = "rate_cont_mva", type = "number", unit = "MVA", required = true, min = 0, desc = "Continuous rating (HV winding)", example = 150 },
  { name = "commissioning_year", type = "int", min = 1950, max = 2040, desc = "Year first energised", example = 2015 },
  { name = "status", type = "enum", enum = ["existing", "committed", "planned", "retired"], required = true, desc = "Status", example = "existing" },
  { name = "in_service", type = "yn", required = true, desc = "In service in this case", example = "Y" },
]

[[sheets]]
name = "generators"
table = "net_gen"
title = "Generators and infeeds"
grain = "one row per generating unit (or plant equivalent) per case"
key = ["case_id", "gen_id"]
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "gen_id", type = "text", required = true, desc = "Your generator identifier", example = "EXA-G1" },
  { name = "name", type = "text", desc = "Unit name", example = "Example Hydro unit 1" },
  { name = "bus", type = "text", required = true, desc = "Connection bus_id", example = "1101" },
  { name = "plant", type = "text", required = true, desc = "Plant name", example = "Example Hydro" },
  { name = "technology", type = "enum", enum = ["hydro", "solar", "thermal", "bagasse", "wind", "import", "other"], required = true, desc = "Technology", example = "hydro" },
  { name = "p_mw", type = "number", unit = "MW", required = true, desc = "Dispatch in this case", example = 40 },
  { name = "p_max_mw", type = "number", unit = "MW", required = true, min = 0, desc = "Maximum output", example = 50 },
  { name = "p_min_mw", type = "number", unit = "MW", min = 0, desc = "Minimum stable output", example = 10 },
  { name = "q_min_mvar", type = "number", unit = "MVAr", desc = "Reactive limit, absorbing", example = -20 },
  { name = "q_max_mvar", type = "number", unit = "MVAr", desc = "Reactive limit, supplying", example = 30 },
  { name = "vm_pu", type = "number", unit = "pu", min = 0.8, max = 1.2, desc = "Voltage set-point", example = 1.01 },
  { name = "control", type = "enum", enum = ["PV", "PQ", "slack"], required = true, desc = "Control mode in this case", example = "PV" },
  { name = "connection_kv", type = "number", unit = "kV", desc = "Voltage at the connection point", example = 132 },
  { name = "in_service", type = "yn", required = true, desc = "In service in this case", example = "Y" },
]

[[sheets]]
name = "loads"
table = "net_load"
title = "Loads (bulk supply points)"
grain = "one row per load per case"
key = ["case_id", "load_id"]
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "load_id", type = "text", required = true, desc = "Your load identifier", example = "EXA-L1" },
  { name = "bus", type = "text", required = true, desc = "Connection bus_id", example = "3301" },
  { name = "substation", type = "text", required = true, desc = "Substation name as you use it", example = "Example A" },
  { name = "bsp_name", type = "text", desc = "Bulk supply point name as NCC and Commercial report it", example = "Example A 33 kV" },
  { name = "share", type = "number", min = 0, max = 1, desc = "Share of the substation's demand served here; blank splits it equally", example = 1 },
  { name = "p_mw", type = "number", unit = "MW", required = true, desc = "Active power in this case", example = 41.2 },
  { name = "q_mvar", type = "number", unit = "MVAr", required = true, desc = "Reactive power in this case", example = 13.5 },
  { name = "in_service", type = "yn", required = true, desc = "In service in this case", example = "Y" },
]

[[sheets]]
name = "shunts"
table = "net_shunt"
title = "Shunt capacitors and reactors"
grain = "one row per shunt per case"
key = ["case_id", "shunt_id"]
required_sheet = false
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "shunt_id", type = "text", required = true, desc = "Your shunt identifier", example = "EXA-C1" },
  { name = "bus", type = "text", required = true, desc = "Connection bus_id", example = "3301" },
  { name = "q_mvar", type = "number", unit = "MVAr", required = true, desc = "At 1.0 pu: positive for a reactor (absorbs), negative for a capacitor (supplies)", example = -10 },
  { name = "steps", type = "int", min = 1, desc = "Number of steps", example = 2 },
  { name = "in_service", type = "yn", required = true, desc = "In service in this case", example = "Y" },
]

[[sheets]]
name = "switches"
table = "net_switch"
title = "Switches and normally-open points"
grain = "one row per switch per case"
key = ["case_id", "switch_id"]
required_sheet = false
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "switch_id", type = "text", required = true, desc = "Your switch identifier", example = "EXA-S1" },
  { name = "bus", type = "text", required = true, desc = "Bus the switch is on", example = "1301" },
  { name = "element_type", type = "enum", enum = ["line", "trafo", "bus"], required = true, desc = "What the switch connects to", example = "line" },
  { name = "element_id", type = "text", required = true, desc = "line_id, trafo_id or bus_id", example = "1301-1402-1" },
  { name = "closed", type = "yn", required = true, desc = "Closed in this case", example = "Y" },
  { name = "normally_open", type = "yn", desc = "A normally-open point", example = "N" },
]

[[sheets]]
name = "boundary"
table = "net_boundary"
title = "Boundary treatment (only for a partial network)"
grain = "one row per boundary bus per case"
key = ["case_id", "bus"]
required_sheet = false
