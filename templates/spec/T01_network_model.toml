columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "bus_id", type = "text", required = true, desc = "bus_id", example = "1301" },
  { name = "vm_pu", type = "number", unit = "pu", required = true, min = 0, max = 2, desc = "Voltage magnitude", example = 1.012 },
  { name = "va_deg", type = "number", unit = "deg", required = true, desc = "Voltage angle", example = -12.4 },
]

[[sheets]]
name = "solved_branches"
table = "net_solved_branch"
title = "Your solved branch results"
grain = "one row per line or transformer per case"
key = ["case_id", "branch_id"]
required_sheet = false
columns = [
  { name = "case_id", type = "text", required = true, desc = "Case from the cases sheet", example = "EXAMPLE-PEAK" },
  { name = "branch_id", type = "text", required = true, desc = "line_id or trafo_id", example = "1301-1402-1" },
  { name = "p_from_mw", type = "number", unit = "MW", required = true, desc = "Active power at the from end, into the branch", example = 61.3 },
  { name = "q_from_mvar", type = "number", unit = "MVAr", desc = "Reactive power at the from end", example = 12.1 },
  { name = "p_to_mw", type = "number", unit = "MW", desc = "Active power at the to end, into the branch", example = -60.9 },
  { name = "q_to_mvar", type = "number", unit = "MVAr", desc = "Reactive power at the to end", example = -13.0 },
  { name = "loading_pct", type = "number", unit = "%", min = 0, desc = "Loading against the rating your tool uses", example = 45.2 },
]

[[sheets]]
name = "changes"
table = "net_change"
title = "Network changes since September 2025"
grain = "one row per change"
key = ["element_id", "change_date"]
required_sheet = false
columns = [
  { name = "change_date", type = "date", required = true, desc = "Date of the change", example = "2026-02-10" },
  { name = "element_id", type = "text", required = true, desc = "line_id, trafo_id, gen_id or bus_id", example = "EXA-T2" },
  { name = "element_type", type = "enum", enum = ["line", "trafo", "gen", "shunt", "bus", "other"], required = true, desc = "Element type", example = "trafo" },
  { name = "change", type = "enum", enum = ["commissioned", "retired", "uprated", "reconductored", "other"], required = true, desc = "What changed", example = "commissioned" },
  { name = "detail", type = "text", desc = "Detail", example = "Example: second 220/132 kV unit" },
]
